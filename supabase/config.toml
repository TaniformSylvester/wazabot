# Supabase CLI config for local development (`npx supabase start`).
# Hosted projects: mirror these Auth settings in the Supabase dashboard
# (see README → "Supabase setup").
project_id = "wazabolt"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322

[inbucket]
# Local email catcher (Mailpit) UI + API.
port = 54324

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
minimum_password_length = 8
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.email.template.confirmation]
subject = "Confirm your WazaBolt account / Confirmez votre compte WazaBolt"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your WazaBolt password / Réinitialisez votre mot de passe WazaBolt"
content_path = "./supabase/templates/recovery.html"
